<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수험생확인대장</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const pathname = window.location.pathname.replace(/\/+$/g, "") || "/";
        document.documentElement.dataset.shellMode = pathname === "/accounts" || pathname === "/schools" || pathname === "/templates" ? "template-list" : "workspace";
      })();
    </script>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/surfaces.css" />
    <link rel="stylesheet" href="/styles/features/grids.css" />
    <link rel="stylesheet" href="/styles/features/templates.css" />
    <link rel="stylesheet" href="/styles/features/schools.css" />
    <link rel="stylesheet" href="/styles/features/candidates.css" />
    <link rel="stylesheet" href="/styles/features/school-settings.css" />
    <link rel="stylesheet" href="/styles/features/pdf-generations.css" />
    <link rel="stylesheet" href="/styles/features/data-deletion.css" />
    <link rel="stylesheet" href="/styles/features/template-editor.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/features/auth.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="brand" id="brandHome" type="button" data-go-view="schoolManagement" aria-label="학교 목록으로 이동">
          <img
            class="brand-badge"
            src="/client/assets/logo.png"
            alt=""
            width="54"
            height="54"
          />
          <div>
            <p class="brand-kicker">Exam List System</p>
            <h1>수험생확인대장</h1>
          </div>
        </button>
      </div>

      <div class="topbar-right" id="authStatus"></div>
    </header>

    <div class="app-shell">
      <aside class="workspace-sidebar hidden" id="workspaceSidebar" aria-label="학교 작업공간 메뉴" aria-hidden="true">
        <nav class="workspace-nav" id="workspaceNav" aria-label="학교 작업공간 메뉴">
          <button class="workspace-nav-item" data-go-view="templateManagement" data-required-permission="viewTemplates" data-school-required="true" type="button">
            <span class="workspace-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M5 3.5h10a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 15 16.5H5A1.5 1.5 0 0 1 3.5 15V5A1.5 1.5 0 0 1 5 3.5Z" />
                <path d="M6.8 7h6.4M6.8 10h6.4M6.8 13h3.8" />
              </svg>
            </span>
            <span class="workspace-nav-label">양식 관리</span>
          </button>
          <button class="workspace-nav-item" data-go-view="candidateLookup" data-required-permission="viewCandidates" data-school-required="true" type="button">
            <span class="workspace-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M7.2 8.6a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM12.8 8.6a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2Z" />
                <path d="M3.7 15.7c.35-2.8 1.65-4.2 3.9-4.2s3.55 1.4 3.9 4.2M8.7 15.7c.28-2.15 1.45-3.25 3.5-3.25 2.2 0 3.45 1.1 3.75 3.25" />
              </svg>
            </span>
            <span class="workspace-nav-label">수험생 데이터</span>
          </button>
          <button class="workspace-nav-item" data-go-view="pdfGenerationHistory" data-required-permission="viewGenerations" data-school-required="true" type="button">
            <span class="workspace-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M10 4.2a5.8 5.8 0 1 1-5.8 5.8" />
                <path d="M4.2 5v3.4h3.4M10 7.1v3.3l2.4 1.5" />
              </svg>
            </span>
            <span class="workspace-nav-label">PDF 생성</span>
          </button>
          <button class="workspace-nav-item" data-go-view="pdfHistoryManagement" data-required-permission="viewGenerations" data-school-required="true" type="button">
            <span class="workspace-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M5 4.4h10a1.4 1.4 0 0 1 1.4 1.4v8.4a1.4 1.4 0 0 1-1.4 1.4H5a1.4 1.4 0 0 1-1.4-1.4V5.8A1.4 1.4 0 0 1 5 4.4Z" />
                <path d="M6.8 8h6.4M6.8 10.5h6.4M6.8 13h3.8" />
              </svg>
            </span>
            <span class="workspace-nav-label">PDF 작업 로그</span>
          </button>
          <button class="workspace-nav-item" data-go-view="dataDeletion" data-required-permission="deleteProjectData" data-school-required="true" type="button">
            <span class="workspace-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" focusable="false">
                <path d="M3.8 6h12.4" />
                <path d="M7.2 6V4.2h5.6V6" />
                <path d="M15.2 6l-.7 10.2H5.5L4.8 6" />
                <path d="M8.2 9.2v4.2M11.8 9.2v4.2" />
              </svg>
            </span>
            <span class="workspace-nav-label">데이터 삭제</span>
          </button>
        </nav>
      </aside>
      <div class="page-shell">
        <main class="content-grid">
          <section class="view-panel" data-view-panel="templateManagement"></section>
          <section class="view-panel hidden" data-view-panel="accountManagement"></section>
          <section class="view-panel hidden" data-view-panel="schoolManagement"></section>
          <section class="view-panel hidden" data-view-panel="pdfGenerationHistory"></section>
          <section class="view-panel hidden" data-view-panel="pdfHistoryManagement"></section>
          <section class="view-panel hidden" data-view-panel="pdfGenerationDetail"></section>
          <section class="view-panel hidden" data-view-panel="dataDeletion"></section>
          <section class="view-panel hidden" data-view-panel="templateEditor"></section>
          <section class="view-panel hidden" data-view-panel="candidateLookup"></section>
        </main>
      </div>
    </div>
    <div id="globalModalHost"></div>

    <script src="/shared/app-config.js"></script>
    <script type="module" src="/client/core.js"></script>
  </body>
</html>
