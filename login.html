<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - 수험생확인대장</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/surfaces.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/features/auth.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
  </head>
  <body class="login-page">
    <main class="login-page-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="auth-login-brand">
          <img class="brand-badge" src="/client/assets/logo.png" alt="" width="54" height="54" />
          <div>
            <p class="brand-kicker">Exam List System</p>
            <h1>수험생확인대장</h1>
          </div>
        </div>

        <div class="login-page-card">
          <div class="login-page-header">
            <div>
              <p class="login-page-kicker">접근 권한</p>
              <h2 id="loginTitle">운영자 로그인</h2>
            </div>
          </div>

          <p class="auth-required-message">수험생확인대장 관리 기능을 사용하려면 로그인하세요.</p>
          <form class="login-page-form" data-login-form method="post" action="/api/auth/login">
            <label class="form-field">
              <span>아이디</span>
              <input name="username" autocomplete="username" required type="text" autofocus placeholder="이름" />
            </label>
            <label class="form-field">
              <span>비밀번호</span>
              <input name="password" autocomplete="current-password" required type="password" placeholder="1234" />
            </label>
            <div class="login-page-actions">
              <button class="primary-button" data-login-submit type="submit">로그인</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="/client/login.js"></script>
  </body>
</html>
